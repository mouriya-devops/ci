[tools]
"aqua:rhysd/actionlint" = "latest"
shellcheck = "latest"
bun = "latest"

[tasks."check:pr"]
description = "Offline workflow policy self-test of .github/workflows and actions"
run = "bun test selftest"

[tasks.check]
description = "Lint every workflow in .github/workflows and run the workflow policy self-test"
depends = ["check:pr"]
run = "actionlint"

[tasks."selftest:task"]
description = "Self-test fixture for actions/mise-check and the check.yml task input: report CI and leave a marker"
run = 'echo "selftest:task ran with CI=$CI" | tee "${RUNNER_TEMP:-/tmp}/selftest-task-ran"'

[tasks.build]
description = "Self-test fixture for image.yml: build ci-selftest/alpha and ci-selftest/beta"
run = "selftest/image/build.sh"

[tasks.release]
description = "Self-test fixture for release-artifact.yml: write one file per platform"
run = "selftest/release/release.sh"
