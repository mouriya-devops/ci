name: PR Check

on:
  pull_request:
    branches: [main, 'tree/**']
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: ./actions/mise-check
        with:
          task: check:pr
