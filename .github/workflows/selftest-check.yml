name: selftest-check

# Exercises actions/mise-check and check.yml from the dispatched commit:
# `test` (default task) must appear as a top-level check, a passed task must
# run, an invalid task must be rejected before mise runs, and check.yml must
# run both its default task and a passed `task`.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: Passed to check.yml `runs-on`.
        type: string
        default: '["ubuntu-24.04"]'
      ref:
        description: Passed to check.yml `ref`.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: ./actions/mise-check

  task-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: ./actions/mise-check
        with:
          task: selftest:task
      - name: Expect the task to have run
        run: cat "$RUNNER_TEMP/selftest-task-ran"

  reject-invalid-task:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - id: invalid
        continue-on-error: true
        uses: ./actions/mise-check
        with:
          task: 'selftest:task; touch injected'
      - name: Expect rejection before mise runs
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test ! -e "$RUNNER_TEMP/selftest-task-ran"
          test ! -e injected
          echo "invalid task rejected: outcome=$OUTCOME, no marker, no injected file"

  check-default:
    uses: ./.github/workflows/check.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      ref: ${{ inputs.ref }}

  check-task:
    uses: ./.github/workflows/check.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      ref: ${{ inputs.ref }}
      task: selftest:task
