name: selftest-check

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: Passed to check.yml `runs-on`.
        type: string
        default: '["ubuntu-24.04"]'
      ref:
        description: Passed to check.yml `ref`.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    uses: mouriya-devops/ci/.github/workflows/check.yml@main
    with:
      runs-on: ${{ inputs.runs-on }}
      ref: ${{ inputs.ref }}
